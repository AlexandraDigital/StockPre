<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" opacity="0.95"/>
  
  <!-- Chart area fill -->
  <path d="M 40 140 Q 60 120 80 100 T 120 80 T 160 40 L 160 160 Q 100 180 40 160 Z" fill="url(#grad2)"/>
  
  <!-- Trending line chart -->
  <polyline points="40,140 60,120 80,100 100,90 120,80 140,60 160,40" 
            stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Dollar sign accent -->
  <text x="100" y="110" font-size="45" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.15">$</text>
  
  <!-- Data points -->
  <circle cx="40" cy="140" r="3" fill="#ffffff"/>
  <circle cx="80" cy="100" r="3" fill="#ffffff"/>
  <circle cx="120" cy="80" r="3" fill="#ffffff"/>
  <circle cx="160" cy="40" r="3" fill="#ffffff"/>
</svg>