<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" fill="url(#bgGradient)" rx="40"/>
  
  <!-- Chart lines (trending upward) -->
  <polyline points="30,140 60,110 90,85 120,65 150,40" stroke="url(#chartGradient)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Dollar sign -->
  <g transform="translate(160, 150)">
    <circle cx="0" cy="0" r="16" fill="#10b981" opacity="0.9"/>
    <text x="0" y="6" font-size="20" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">$</text>
  </g>
  
  <!-- Accent circles -->
  <circle cx="35" cy="35" r="8" fill="#34d399" opacity="0.6"/>
  <circle cx="165" cy="50" r="5" fill="#fbbf24" opacity="0.7"/>
</svg>