<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00CC6A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" opacity="0.1" stroke="url(#grad1)" stroke-width="2"/>
  
  <!-- Main circle background -->
  <circle cx="100" cy="100" r="85" fill="#FFFFFF" />
  
  <!-- Stock chart lines -->
  <!-- Line 1 - starting low -->
  <polyline points="40,120 60,100 75,85 90,95" fill="none" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Line 2 - going up -->
  <polyline points="110,110 125,85 140,70 160,50" fill="none" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Decorative data points -->
  <circle cx="60" cy="100" r="4" fill="url(#grad1)"/>
  <circle cx="75" cy="85" r="4" fill="url(#grad1)"/>
  <circle cx="125" cy="85" r="4" fill="url(#grad2)"/>
  <circle cx="140" cy="70" r="4" fill="url(#grad2)"/>
  
  <!-- Dollar sign symbol -->
  <text x="100" y="155" font-size="32" font-weight="bold" fill="url(#grad1)" text-anchor="middle" opacity="0.3">$</text>
  
  <!-- Outer accent ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#grad1)" stroke-width="1" opacity="0.3"/>
</svg>